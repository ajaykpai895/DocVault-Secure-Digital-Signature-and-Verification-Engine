version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: docvault_secret
      POSTGRES_DB: docvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Application ─────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://docvault:docvault_secret@db:5432/docvault
      DES3_MASTER_KEY: ${DES3_MASTER_KEY:-123456789012345678901234}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      STORAGE_PATH: /app/storage
    volumes:
      - docvault_storage:/app/storage

volumes:
  postgres_data:
  docvault_storage:
